title: Blueshores
description: Living foreshores for working ports
baseurl: "/Blueshores"
url: "https://blueshoresweb.github.io"

theme: minima
markdown: kramdown

header_pages:
  - index.md
  - objectives.md
  - case-studies/index.md
  - news/index.md
  - about.md

# GitHub Pages configuration
plugins:
  - jekyll-feed
  - jekyll-sitemap

  # News posts (docs/_posts/YYYY-MM-DD-title.md)
permalink: /news/:title/
future: true
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: news-post
